name: Deploy Mark IV Web Amp to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Stage web bundle
        run: |
          rm -rf dist
          mkdir -p dist

          if [ -d "public" ] && [ -n "$(ls -A public 2>/dev/null)" ]; then
            cp -r public/. dist/
          fi

          if [ -f "index.html" ] && [ ! -f "dist/index.html" ]; then
            cp index.html dist/
          fi

          if [ -f "styles.css" ] && [ ! -f "dist/styles.css" ]; then
            cp styles.css dist/
          fi

          if [ -d "src" ] && [ -n "$(ls -A src 2>/dev/null)" ]; then
            mkdir -p dist/src
            cp -r src/. dist/src/
          fi

          if [ ! -f "dist/index.html" ]; then
            echo "Error: index.html not found in public/ or repository root."
            exit 1
          fi

          echo "Staged files in dist/:"
          find dist -maxdepth 3 -ls

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "./dist"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
